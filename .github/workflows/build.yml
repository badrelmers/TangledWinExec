name: Build All Solutions (VS 2022)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Restore NuGet Packages
      run: |
        Get-ChildItem -Recurse -Filter *.sln | ForEach-Object {
            nuget restore $_.FullName
        }

    # =========================================================
    # C# / .NET Solutions (Require "Any CPU")
    # =========================================================

    - name: Build BlockingDLL
      run: msbuild .\BlockingDLL\BlockingDLL.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build CloneProcess
      run: msbuild .\CloneProcess\CloneProcess.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build CommandLineSpoofing
      run: msbuild .\CommandLineSpoofing\CommandLineSpoofing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build DarkLoadLibrary
      run: msbuild .\DarkLoadLibrary\DarkLoadLibrary.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build GhostlyHollowing
      run: msbuild .\GhostlyHollowing\GhostlyHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build PhantomDllHollower
      run: msbuild .\PhantomDllHollower\PhantomDllHollower.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build PPIDSpoofing
      run: msbuild .\PPIDSpoofing\PPIDSpoofing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessDoppelgaenging
      run: msbuild .\ProcessDoppelgaenging\ProcessDoppelgaenging.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessGhosting
      run: msbuild .\ProcessGhosting\ProcessGhosting.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessHerpaderping
      run: msbuild .\ProcessHerpaderping\ProcessHerpaderping.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessHollowing
      run: msbuild .\ProcessHollowing\ProcessHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcMemScan
      run: msbuild .\ProcMemScan\ProcMemScan.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProtectedProcess - SdDumper
      run: msbuild .\ProtectedProcess\SdDumper\SdDumper.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ReflectiveDLLInjection
      run: msbuild .\ReflectiveDLLInjection\ReflectiveDLLInjection.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build sRDI
      run: msbuild .\sRDI\sRDI.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build TransactedHollowing
      run: msbuild .\TransactedHollowing\TransactedHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build WmiSpawn
      run: msbuild .\WmiSpawn\WmiSpawn.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    # =========================================================
    # Native & Specific Architecture Solutions (Use x64)
    # =========================================================

    - name: Build ProtectedProcess - PPEditor
      run: msbuild .\ProtectedProcess\PPEditor\PPEditor.sln /p:Configuration=Release /p:Platform=x64 /m

    # =========================================================
    # Gather and Stage Compiled Artifacts
    # =========================================================

    - name: Stage Artifacts for Zipping
      run: |
        # Create a clean folder to stage everything
        New-Item -ItemType Directory -Force -Path .\StagedBinaries
        
        # Find all .exe and .dll files recursively within Release output folders
        Get-ChildItem -Recurse -Include *.exe, *.dll | Where-Object { 
            $_.FullName -match '\\bin\\(x64\\)?Release\\' 
        } | ForEach-Object {
            # Capture parent directory name to prevent naming conflicts (e.g. separate tools named 'Program.exe')
            $parentFolder = $_.Directory.Parent.Parent.Name
            if ($_.Directory.Name -eq "x64") { $parentFolder = $_.Directory.Parent.Parent.Parent.Name }
            
            $targetDir = ".\StagedBinaries\$parentFolder"
            New-Item -ItemType Directory -Force -Path $targetDir
            
            Write-Host "Staging binary: $($_.FullName) -> $targetDir"
            Copy-Item -Path $_.FullName -Destination $targetDir -Force
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TangledWinExec-Binaries
        path: .\StagedBinaries\
        retention-days: 7
