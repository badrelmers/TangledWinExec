name: Build All Solutions (VS 2022)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Restore NuGet Packages
      run: |
        Get-ChildItem -Recurse -Filter *.sln | ForEach-Object {
            nuget restore $_.FullName
        }

    # =========================================================
    # C# / .NET Solutions (Require "Any CPU")
    # =========================================================

    - name: Build BlockingDLL
      run: msbuild .\BlockingDLL\BlockingDLL.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build CloneProcess
      run: msbuild .\CloneProcess\CloneProcess.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build CommandLineSpoofing
      run: msbuild .\CommandLineSpoofing\CommandLineSpoofing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build DarkLoadLibrary
      run: msbuild .\DarkLoadLibrary\DarkLoadLibrary.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build GhostlyHollowing
      run: msbuild .\GhostlyHollowing\GhostlyHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build PhantomDllHollower
      run: msbuild .\PhantomDllHollower\PhantomDllHollower.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build PPIDSpoofing
      run: msbuild .\PPIDSpoofing\PPIDSpoofing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessDoppelgaenging
      run: msbuild .\ProcessDoppelgaenging\ProcessDoppelgaenging.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessGhosting
      run: msbuild .\ProcessGhosting\ProcessGhosting.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessHerpaderping
      run: msbuild .\ProcessHerpaderping\ProcessHerpaderping.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcessHollowing
      run: msbuild .\ProcessHollowing\ProcessHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProcMemScan
      run: msbuild .\ProcMemScan\ProcMemScan.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ProtectedProcess - SdDumper
      run: msbuild .\ProtectedProcess\SdDumper\SdDumper.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build ReflectiveDLLInjection
      run: msbuild .\ReflectiveDLLInjection\ReflectiveDLLInjection.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build sRDI
      run: msbuild .\sRDI\sRDI.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build TransactedHollowing
      run: msbuild .\TransactedHollowing\TransactedHollowing.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Build WmiSpawn
      run: msbuild .\WmiSpawn\WmiSpawn.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    # =========================================================
    # Native & Specific Architecture Solutions (Use x64)
    # =========================================================

    - name: Build ProtectedProcess - PPEditor
      run: msbuild .\ProtectedProcess\PPEditor\PPEditor.sln /p:Configuration=Release /p:Platform=x64 /m

    # =========================================================
    # Dynamic Compilation for Misc Folder (Bypasses PEUtils)
    # =========================================================

    - name: Build all solutions in Misc
      run: |
        Get-ChildItem -Path .\Misc -Filter *.sln -Recurse | ForEach-Object {
            Write-Host "------------------------------------------------------"
            Write-Host "Building Misc Component: $($_.FullName)"
            Write-Host "------------------------------------------------------"
            msbuild $_.FullName /p:Configuration=Release /m
        }

    # =========================================================
    # Gather, Purge Leftovers, and Stage Artifacts
    # =========================================================

    - name: Stage Content and Purge Build Clutter
      run: |
        # 1. Create staging root directory
        New-Item -ItemType Directory -Force -Path .\StagedBinaries
        
        # 2. Locate all active build output folders named 'Release' (ignoring intermediate 'obj' workspaces)
        Get-ChildItem -Recurse -Directory | Where-Object { 
            $_.Name -eq "Release" -and $_.FullName -notmatch '\\obj\\' 
        } | ForEach-Object {
            
            # Obtain repository relative pathway structure
            $relative = Resolve-Path -Relative $_.FullName
            $cleanName = $relative -replace '^\.\\', ''
            
            # Strip standard build environment sub-paths to isolate clean module root identifiers
            $cleanName = $cleanName -replace '\\bin\\Release$', ''
            $cleanName = $cleanName -replace '\\bin\\x64\\Release$', ''
            $cleanName = $cleanName -replace '\\x64\\Release$', ''
            $cleanName = $cleanName -replace '\\Release$', ''
            
            $targetDir = ".\StagedBinaries\$cleanName"
            New-Item -ItemType Directory -Force -Path $targetDir
            
            Write-Host "Staging build directory: $($_.FullName) -> $targetDir"
            Copy-Item -Path "$($_.FullName)\*" -Destination $targetDir -Recurse -Force
        }
        
        # 3. Explicitly copy the uncompiled PEUtils tool directory
        if (Test-Path ".\Misc\PEUtils") {
            Write-Host "Staging static utility folder: Misc\PEUtils"
            $targetPEUtils = ".\StagedBinaries\Misc\PEUtils"
            New-Item -ItemType Directory -Force -Path $targetPEUtils
            Copy-Item -Path ".\Misc\PEUtils\*" -Destination $targetPEUtils -Recurse -Force
        }
        
        # 4. Find and mirror any documentation / README files from the source directories
        Get-ChildItem -Recurse -Filter "README*" | Where-Object {
            $_.FullName -notmatch '\\StagedBinaries\\' -and $_.FullName -notmatch '\\obj\\' -and $_.FullName -notmatch '\\bin\\'
        } | ForEach-Object {
            $relativeDir = Resolve-Path -Relative $_.FullName
            $cleanPath = $relativeDir -replace '^\.\\', ''
            $targetFile = ".\StagedBinaries\$cleanPath"
            $targetDir = Split-Path $targetFile -Parent
            
            if (!(Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir
            }
            Write-Host "Mirroring documentation: $cleanPath"
            Copy-Item -Path $_.FullName -Destination $targetFile -Force
        }

        # 5. Find and mirror any 'figures' asset folders from the source directories
        Get-ChildItem -Recurse -Directory -Filter "figures" | Where-Object {
            $_.FullName -notmatch '\\StagedBinaries\\' -and $_.FullName -notmatch '\\obj\\' -and $_.FullName -notmatch '\\bin\\'
        } | ForEach-Object {
            $relativeDir = Resolve-Path -Relative $_.FullName
            $cleanPath = $relativeDir -replace '^\.\\', ''
            $targetDir = ".\StagedBinaries\$cleanPath"
            
            New-Item -ItemType Directory -Force -Path $targetDir
            Write-Host "Mirroring figures asset directory: $cleanPath"
            Copy-Item -Path "$($_.FullName)\*" -Destination $targetDir -Recurse -Force
        }

        Write-Host "======================================================"
        Write-Host "Purging C++ compiler intermediate leftovers & linker residue..."
        Write-Host "======================================================"
        
        # Target and delete specific MSVC compilation artifacts (includes .lib and .exp)
        Get-ChildItem -Path .\StagedBinaries -Recurse -File | Where-Object {
            $_.Extension -in '.pdb', '.ilk', '.recipe', '.iobj', '.ipdb', '.pch', '.obj', '.lib', '.exp'
        } | ForEach-Object {
            Write-Host "Removing intermediate file: $($_.FullName)"
            Remove-Item -Path $_.FullName -Force
        }
        
        # Completely drop compilation tracking log directories (.tlog)
        Get-ChildItem -Path .\StagedBinaries -Recurse -Directory | Where-Object {
            $_.Name -like "*.tlog"
        } | ForEach-Object {
            Write-Host "Dropping log folder: $($_.FullName)"
            Remove-Item -Path $_.FullName -Recurse -Force
        }

    - name: Upload Complete Artifact Package
      uses: actions/upload-artifact@v4
      with:
        name: TangledWinExec-Binaries
        path: .\StagedBinaries\
        retention-days: 7
